server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Clothing photo uploads go up to 10MB, plus the profile photo sent as a data URL
  client_max_body_size 20m;

  location /api/ {
    proxy_pass http://server:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # An outfit request runs the LLM, product search and two image generations (~30-90s)
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
  }

  # Hashed build assets never change
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Single-page app: unknown paths serve index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
